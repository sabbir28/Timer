<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — Timer420{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        winBg: '#1C1C1C',
                        winBgAlt: '#202020',
                        winAccent: '#0078D4',
                        winCyan: '#00BCD4',
                        winPurple: '#8E8CD8',
                        winMint: '#107C41'
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom Windows Fluent Styles -->
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>

<body
    class="bg-[#1C1C1C] text-white min-h-screen selection:bg-[#0078D4] selection:text-white flex flex-col justify-between">

    {% include header.html %}

    <div class="flex-grow">
        {{ content }}
    </div>

    {% include footer.html %}

    <!-- App JS -->
    <script src="{{ '/app.js' | relative_url }}"></script>
</body>

</html>
